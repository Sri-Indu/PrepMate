[project]
name = "prepmate-backend"
version = "0.1.0"
description = "PrepMate FastAPI backend"
requires-python = ">=3.11"
readme = "../README.md"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "pypdf>=5.1.0",
  "sentence-transformers>=3.3.0",
  "faiss-cpu>=1.9.0",
  "numpy>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
